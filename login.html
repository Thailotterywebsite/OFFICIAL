<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thai Lottery Government Agency</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="assets/images/logo.png">


</head>
<body class="auth-body">

<div class="auth-container">
  <img src="./assets/images/logo.png" alt="Logo" class="auth-logo">

  <h2>Login</h2>
  <p class="auth-sub">Access to our dashboard</p>

  <form class="auth-form">
    <input type="email" placeholder="Email Address" required>
    <input type="password" placeholder="Password" required>

    <div class="auth-row">
      <span></span>
      <a href="#" class="auth-link">Forgot password?</a>
    </div>

    <button type="submit" class="auth-btn">Login</button>
  </form>

  <p class="auth-text">
    Do not have an account yet?
    <a href="register.html">Register</a>
  </p>

  <p class="auth-text small">
    Are you agent? <a href="login.html">Login</a>
  </p>
</div>
<script src="./assets/js/main.js"></script>

</body>
</html>
